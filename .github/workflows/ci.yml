name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Tests (API & ESH RAG)
    runs-on: ubuntu-latest
    env:
      # onnxruntime-node trên Linux x64 mặc định tải thêm bản CUDA (GPU) và có thể lỗi 404;
      # bot ESH chỉ chạy embedding trên CPU nên bỏ qua.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai/backend/package-lock.json
      - name: Install backend dependencies
        run: npm --prefix ai/backend ci
      # Bot ESH chạy embedding cục bộ với allowRemoteModels=false, nên model (~130 MB) phải có sẵn
      # trong ai/backend/.cache/models trước khi chạy test. Cache lại để không tải mỗi lần.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ai/backend/.cache/models
          key: embeddings-${{ hashFiles('ai/backend/utils/localEmbeddings.js', 'ai/backend/scripts/prepareEmbeddings.js', 'ai/backend/package-lock.json') }}
      - name: Prepare local embedding model
        run: npm --prefix ai/backend run prepare:embeddings
      - name: Run test suite
        run: npm --prefix ai/backend test

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix ai/frontend ci
      - name: Run frontend typecheck lint
        run: npm --prefix ai/frontend run lint
      - name: Build Next.js application
        run: npm --prefix ai/frontend run build
